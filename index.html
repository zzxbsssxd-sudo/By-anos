<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="galaxy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lingua: منصة تفاعلية لتعلّم 12 لغة عبر التمارين والألعاب والمراجعة المتباعدة وتقارير التقدم.">
<meta name="theme-color" content="#0a0720">
<meta name="color-scheme" content="dark light">
<title>Lingua — تعلّم اللغات بذكاء</title>
<style>
:root{--fs:1;--bg:#f2f4fb;--sf:#fff;--tx:#1d2140;--mut:#7a82a6;--pr:#5b5bf0;--pr2:#3d3dc4;--ok:#16a34a;--okbg:rgba(22,163,74,.15);--bad:#e11d48;--badbg:rgba(225,29,72,.15);--bd:#e1e5f2;--f:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;--r:18px}
[data-theme=night]{--bg:#0f1220;--sf:#191d33;--tx:#eceeff;--mut:#8f97bd;--pr:#7d84ff;--pr2:#545bd6;--bd:#2a3050;--ok:#34d399;--bad:#fb7185}
[data-theme=sunset]{--bg:#fff3e6;--sf:#fffdf9;--tx:#3a2315;--mut:#9a7b64;--pr:#f97316;--pr2:#c2570c;--bd:#f2dcc6}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:500 calc(16px*var(--fs))/1.55 var(--f);min-height:100vh;transition:background .3s}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:var(--sf);border-inline-end:2px solid var(--bd)}
.brand{font:900 1.6rem var(--f);color:var(--pr);padding:0 10px 14px}.brand b{color:var(--ok)}
nav button{display:flex;gap:10px;align-items:center;font:inherit;font-weight:700;color:var(--mut);background:none;border:2px solid transparent;border-radius:14px;padding:11px 12px;cursor:pointer;text-align:start}
nav button[aria-current=true]{color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent);border-color:color-mix(in srgb,var(--pr) 35%,transparent)}
main{max-width:820px;width:100%;margin:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pair{display:flex;gap:6px;flex:1;min-width:250px}.pair select{flex:1}
select{font:inherit;color:var(--tx);background:var(--sf);border:2px solid var(--bd);border-radius:12px;padding:9px 10px;min-width:0}select option{color:#111}
.pills{display:flex;gap:6px}.pill{background:var(--sf);border:2px solid var(--bd);border-radius:20px;padding:3px 12px;font-weight:800;white-space:nowrap}
.btn,.chip,.opt{font:inherit;font-weight:700;color:var(--tx);background:var(--sf);border:2px solid var(--bd);border-bottom-width:4px;border-radius:14px;padding:9px 15px;cursor:pointer;transition:transform .1s}
.btn:active,.chip:active,.opt:active{transform:translateY(2px);border-bottom-width:2px}
.btn:disabled,.chip.off{opacity:.4;pointer-events:none}
.pr{background:var(--pr);border-color:var(--pr2);color:#fff}
.card{background:var(--sf);border:2px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:14px;animation:pop .45s backwards}
@keyframes pop{from{opacity:0;transform:translateY(12px)}}
.modes{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px}.modes .chip{white-space:nowrap}
.mode[aria-pressed=true]{background:var(--pr);border-color:var(--pr2);color:#fff}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px}.gh div{display:flex;gap:6px}
.tag{font-weight:800;color:var(--pr)}
h2{font-size:1.5rem;margin:10px 0 6px;line-height:1.4}h3.big{font-size:1.6rem;margin:10px 0}h4{margin:0 0 10px}
.sub,.mean{color:var(--mut);margin:6px 0}
.tw{position:relative;margin:10px 0;padding:14px 14px 10px;border:2px dashed var(--bd);border-radius:var(--r)}
.trace{font-size:calc(1.9rem*var(--fs));line-height:2.7;word-break:break-word;min-height:3em}
.ghost{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;cursor:text}
.ch{position:relative;transition:color .15s}
.ch.p{color:var(--mut);opacity:.5}.ch.o{color:var(--ok)}
.ch.x{color:var(--bad);background:var(--badbg);border-radius:5px}
.ch.cur{border-bottom:3px solid var(--pr);animation:bl 1s steps(2) infinite}@keyframes bl{50%{border-color:transparent}}
.bal{position:absolute;bottom:92%;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;font:800 .42em var(--f);min-width:1.6em;text-align:center;padding:.15em .5em;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;line-height:1.5;pointer-events:none;white-space:pre}
.bal:after{content:"";position:absolute;top:100%;left:50%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--bad)}
.bal.new{animation:bal .7s cubic-bezier(.3,1.7,.5,1)}@keyframes bal{from{transform:translate(-50%,16px) scale(.2);opacity:0}}
.words,.tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tray{min-height:56px;padding:8px;border:2px dashed var(--bd);border-radius:14px}
.word{animation:pop .4s backwards;font-size:1.1rem}
.chip.o,.opt.o{background:var(--okbg);border-color:var(--ok)}.chip.x,.opt.x{background:var(--badbg);border-color:var(--bad)}.chip.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 15%,var(--sf))}
.opt{display:block;width:100%;margin:8px 0;text-align:start;font-size:1.1rem}
.mic{width:100%;font-size:1.2rem;padding:16px;margin:8px 0}.rec{animation:pul 1s infinite}@keyframes pul{50%{box-shadow:0 0 0 14px transparent}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#nx{flex:1;font-size:1.05rem}
.okk{color:var(--ok);font-weight:800;font-size:1.15rem;margin:8px 0}.bad{color:var(--bad);font-weight:800}
.tip{margin-top:8px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--pr) 10%,transparent);border-inline-start:4px solid var(--pr);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;flex:1}.stat{background:var(--bg);border-radius:14px;padding:8px;text-align:center}.stat b{display:block;font-size:1.25rem}.stat span{font-size:.75rem;color:var(--mut)}
.meh{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;position:relative}.ring:before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--sf)}.ring b{position:relative}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.7rem;color:var(--mut)}.bar i{display:block;width:100%;background:var(--pr);border-radius:6px 6px 0 0;transition:height .6s}
.badge{font-size:1.5rem;padding:6px 12px;border-radius:14px;background:var(--bg)}.badge.off{filter:grayscale(1);opacity:.3}
.wr{display:flex;gap:8px;align-items:center;padding:12px}.wr .mean{flex:1;margin:0}
.form label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.form input[type=range]{accent-color:var(--pr);width:50%}.form .row{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}
dialog{background:var(--sf);color:var(--tx);border:2px solid var(--bd);border-radius:var(--r);width:min(92%,480px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
#toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:30px;opacity:0;transform:translateY(20px);transition:.3s;pointer-events:none;z-index:20}#toast.on{opacity:1;transform:none}
.cf{position:fixed;top:45%;width:8px;height:12px;border-radius:2px;animation:cf 1.1s ease-out forwards;z-index:30;pointer-events:none}@keyframes cf{to{transform:translate(var(--x),calc(var(--y) + 380px)) rotate(var(--r));opacity:0}}
main{min-width:0}
@media(max-width:760px){.app{grid-template-columns:minmax(0,1fr)}nav{position:fixed;top:auto;bottom:0;inset-inline:0;height:auto;flex-direction:row;justify-content:space-around;z-index:10;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--bd);border-inline-end:0}.brand{display:none}nav button{flex-direction:column;gap:0;font-size:.72rem;padding:6px 10px}main{padding-bottom:100px}.trace{font-size:calc(1.5rem*var(--fs))}}

html[data-theme=galaxy]{--bg:#0a0720;--sf:rgba(255,255,255,.07);--tx:#f4f1ff;--mut:#aaa4d8;--pr:#a083ff;--pr2:#6c4ff0;--bd:rgba(255,255,255,.15);--ok:#3ee6b0;--bad:#ff5c8a;--okbg:rgba(62,230,176,.16);--badbg:rgba(255,92,138,.18)}
body{background:var(--bg)}
body:before{content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;filter:blur(40px);opacity:.55;background:radial-gradient(38% 38% at 18% 22%,color-mix(in srgb,var(--pr) 55%,transparent),transparent),radial-gradient(34% 34% at 82% 28%,rgba(45,212,191,.38),transparent),radial-gradient(40% 40% at 62% 88%,rgba(255,92,138,.3),transparent);animation:mesh 20s ease-in-out infinite alternate}
html:not([data-theme=galaxy]) body:before{opacity:.22}
@keyframes mesh{to{transform:translate(6%,4%) rotate(8deg) scale(1.12)}}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.card,nav{backdrop-filter:blur(18px) saturate(1.3)}
.card.game{position:relative;overflow:visible;transition:transform .25s ease-out;transform-style:preserve-3d}
.card.game:before{content:"";position:absolute;inset:-2px;z-index:-1;border-radius:calc(var(--r) + 2px);background:conic-gradient(from var(--a,0deg),var(--pr),#2dd4bf,#ff5c8a,var(--pr));opacity:.55;animation:spin 6s linear infinite;filter:blur(8px)}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}@keyframes spin{to{--a:360deg}}
.page{animation:sl .45s cubic-bezier(.2,.8,.2,1)}@keyframes sl{from{opacity:0;transform:translateY(18px) scale(.98)}}
.pr{box-shadow:0 6px 22px -6px var(--pr)}.pr:hover{filter:brightness(1.12)}
.mode[aria-pressed=true]{box-shadow:0 0 18px -2px var(--pr)}
.xpb{height:9px;background:var(--bd);border-radius:9px;overflow:hidden;margin:-4px 0 12px}.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pr),#2dd4bf,#ff5c8a);background-size:200%;animation:sh 3s linear infinite;border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}@keyframes sh{to{background-position:-200% 0}}
.mas{display:flex;align-items:center;gap:10px;margin-bottom:8px}.mv{width:62px;height:62px;flex:none;animation:flo 3.2s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}@keyframes flo{50%{transform:translateY(-6px) rotate(-3deg)}}
.bub{background:var(--bg);border:2px solid var(--bd);border-radius:16px;padding:6px 12px;font-weight:700;font-size:.92rem}
.mas .m{display:none}.mas.idle .m-h,.mas.happy .m-h{display:block}.mas.sad .m-s,.mas.oops .m-o{display:block}
.eyes{transform-box:fill-box;transform-origin:center;animation:bk 4s infinite}@keyframes bk{93%,97%{transform:scaleY(.1)}}
.mas.happy .mv{animation:jp .7s}.mas.sad .mv,.mas.oops .mv{animation:shk .5s}@keyframes jp{40%{transform:translateY(-16px) scale(1.1)}}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ch{position:static;transition:none}.ch.p{opacity:1;color:color-mix(in srgb,var(--mut) 60%,transparent)}
.bal{bottom:auto;left:0;top:0;transform:translate(-50%,-100%);margin-top:2px;z-index:3}.bal.new{animation:bal2 .7s cubic-bezier(.3,1.7,.5,1)}@keyframes bal2{from{transform:translate(-50%,-30%) scale(.2);opacity:0}}
.quests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 12px}
.qc{background:var(--sf);border:2px solid var(--bd);border-radius:14px;padding:8px 10px;font-size:.78rem;font-weight:700}.qc.ok{border-color:var(--ok)}.qc .xpb{margin:6px 0 0;height:6px}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.keys button{padding:4px 11px;font-size:1.05rem}
.opt.big{font-size:1.5rem;padding:44px 16px;text-align:center}
.hm{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}.hm i{aspect-ratio:1;border-radius:5px;background:var(--bd)}
.big2{font-size:2rem;font-weight:900}.up{color:var(--ok)}.dn{color:var(--bad)}
@media(max-width:760px){.quests{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,:before,:after{animation:none!important;transition:none!important}}

/* Lingua premium arcade layer */
.games-hero{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.2);border-radius:26px;padding:24px;margin:8px 0 18px;background:linear-gradient(125deg,rgba(124,85,255,.35),rgba(25,205,190,.16),rgba(255,90,145,.22));box-shadow:0 18px 55px rgba(0,0,0,.2)}
.games-hero:after{content:"✦";position:absolute;font-size:190px;line-height:1;opacity:.08;left:18px;top:-42px;animation:spin 22s linear infinite}.games-kicker{font-size:.72rem;letter-spacing:.18em;color:#bdb1ff;font-weight:900}.games-hero h2{font-size:clamp(1.7rem,5vw,2.6rem);margin:10px 0}.games-hero p{max-width:560px;color:var(--mut)}.games-count{display:flex;align-items:baseline;gap:10px;margin-top:14px}.games-count strong{font-size:2.4rem;color:#8eeedb}.games-count span{color:var(--mut);font-weight:800}.games-tools{display:flex;gap:10px;margin:12px 0 16px}.games-tools input{flex:1;min-width:0;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:13px;padding:12px;font:inherit}.games-tools select{max-width:145px}.games-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.challenge-card{min-width:0;padding:15px;border-radius:18px;border:1px solid var(--bd);background:linear-gradient(145deg,var(--sf),color-mix(in srgb,var(--pr) 7%,var(--sf)));box-shadow:0 8px 24px rgba(0,0,0,.12);animation:pop .35s backwards;transition:transform .2s,border-color .2s}.challenge-card:hover{transform:translateY(-4px);border-color:var(--pr)}.challenge-top{display:flex;align-items:center;gap:8px}.challenge-num{font-size:.72rem;color:var(--mut);font-weight:900}.challenge-icon{font-size:1.35rem}.challenge-tag{margin-inline-start:auto;border:1px solid var(--bd);border-radius:20px;padding:3px 8px;color:var(--mut);font-size:.7rem;font-weight:800}.challenge-card h3{font-size:1.05rem;margin:12px 0 4px}.challenge-card p{font-size:.82rem;color:var(--mut);min-height:2.5em;margin:0 0 12px}.challenge-start{width:100%;font-size:.86rem;padding:8px}.games-hero,.challenge-card{backdrop-filter:blur(18px)}
/* Spaced-repetition vocabulary review */
.word-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0 16px;padding:14px 16px;border:1px solid var(--bd);border-radius:16px;background:var(--sf)}
.word-tools p{margin:0;color:var(--mut);font-size:.9rem}.review-card{padding:24px;text-align:center;border:1px solid var(--bd);border-radius:20px;background:linear-gradient(145deg,var(--sf),color-mix(in srgb,var(--pr) 10%,var(--sf)));margin:12px 0}.review-word{font-size:clamp(1.8rem,7vw,2.8rem);font-weight:900;margin:16px 0;overflow-wrap:anywhere}.review-answer{font-size:1.15rem;color:var(--ok);font-weight:800;min-height:2rem}.review-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}.review-actions .btn{min-width:120px}.review-progress{height:7px;border-radius:9px;background:var(--bd);overflow:hidden;margin:12px 0}.review-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),#2dd4bf)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
@media(max-width:760px){.games-grid{grid-template-columns:1fr 1fr;gap:8px}.challenge-card{padding:11px}.challenge-card p{font-size:.76rem}.games-tools{flex-wrap:wrap}.games-tools input{flex-basis:100%}.games-tools select{max-width:none;width:100%}}
@media(max-width:380px){.games-grid{grid-template-columns:1fr}}

</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
<nav id="nav"><div class="brand">Lingua<b>.</b></div>
<button data-p="learn"><i>🏠</i><span data-t="nav_learn"></span></button>
<button data-p="words"><i>📒</i><span data-t="nav_words"></span></button>
<button data-p="me"><i>📊</i><span data-t="nav_me"></span></button>
<button data-p="games"><i>🎮</i><span data-t="nav_games"></span></button><button data-p="set"><i>⚙️</i><span data-t="nav_set"></span></button></nav>
<main>
<header class="top" aria-label="إعدادات التعلّم"><div class="pair"><select id="nat" aria-label="from"></select><button id="swap" class="btn" aria-label="swap">⇄</button><select id="tar" aria-label="to"></select></div>
<div class="pills" id="hud"></div><button class="btn" id="snd" aria-label="sound">🔊</button></header>
<div class="xpb"><i id="xpf"></i></div>
<section id="p-learn" class="page">
<div class="modes" id="modes"></div>
<div class="quests" id="quests"></div>
<div class="card game">
<div class="mas idle" id="mas"></div>
<div class="gh"><span class="tag" id="gm"></span><div><button class="btn" id="say" aria-label="listen">🔊</button><button class="btn" id="slow" aria-label="slow">🐢</button></div></div>
<h2 id="q" dir="auto"></h2><div id="body"></div><div id="fb" aria-live="polite"></div>
<div class="acts"><button class="btn" id="hn" data-t="hint"></button><button class="btn" id="sk" data-t="skip"></button><button class="btn pr" id="nx" data-t="next" hidden></button></div>
</div></section>
<section id="p-words" class="page" hidden><h3 data-t="nav_words"></h3><div class="word-tools"><p id="wordSummary">احفظ الكلمات المهمة وراجعها حتى تثبت في ذاكرتك.</p><button class="btn pr" id="reviewStart">ابدأ المراجعة ←</button></div><div id="reviewArea" hidden></div><div id="wl"></div></section>
<section id="p-me" class="page" hidden></section>
<section id="p-set" class="page" hidden><div class="card form">
<label><span data-t="theme"></span><span><button class="btn" data-th="day">☀️</button> <button class="btn" data-th="night">🌙</button> <button class="btn" data-th="sunset">🌅</button> <button class="btn" data-th="galaxy">🌌</button></span></label>
<label><span data-t="level"></span><select id="lv"></select></label>
<label><span data-t="goal"></span><select id="goal"></select></label>
<label><span data-t="size"></span><input type="range" id="fs" min="0.85" max="1.4" step="0.05"></label>
<label><span data-t="auto"></span><input type="checkbox" id="auto"></label>
<label><span data-t="lax"></span><input type="checkbox" id="lax"></label>
<label><span data-t="music"></span><select id="mus"></select></label>
<label><span data-t="mvol"></span><input type="range" id="mv" min="0" max="1" step="0.05"></label>
<label><span data-t="fvol"></span><input type="range" id="fv" min="0" max="1" step="0.05"></label>
<label><span data-t="speed"></span><input type="range" id="rate" min="0.5" max="1.2" step="0.1"></label>
<label><span data-t="voice"></span><select id="vo"></select></label>
<p class="mean" id="vn"></p>
<label><span data-t="pitch"></span><input type="range" id="pt" min="0.5" max="1.5" step="0.05"></label>
<label><span data-t="rec"></span><input type="checkbox" id="rec"></label>
<div class="row"><button class="btn" id="vt" data-t="vtest"></button></div>
<p class="mean">🔒 يُحفظ تقدمك على هذا الجهاز والمتصفح فقط. لا يوجد تسجيل دخول أو مزامنة سحابية في هذه النسخة.</p>
<div class="row"><button class="btn" id="tst" data-t="test"></button><button class="btn" id="exp" data-t="export"></button><button class="btn" id="imp" data-t="import"></button><button class="btn" id="reset" data-t="reset"></button></div>
</div></section>
<section id="p-games" class="page" hidden><div class="games-hero"><div class="games-kicker">LINGUA ARCADE · 60 CHALLENGES</div><h2>منطقة التحديات</h2><p>اختر تحديًا وابدأ فورًا. تتنوع الأهداف بين الاستماع والكتابة والذاكرة والنطق.</p><div class="games-count"><strong>60</strong><span>تحديًا تدريبيًا</span></div></div><div class="games-tools"><input id="gameSearch" type="search" placeholder="ابحث عن تحدٍ…" aria-label="ابحث عن تحدٍ"><select id="gameFilter" aria-label="تصنيف التحديات"><option value="all">كل التحديات</option><option value="write">الكتابة</option><option value="listen">الاستماع</option><option value="memory">الذاكرة</option><option value="speak">النطق</option><option value="speed">السرعة</option><option value="words">المفردات</option></select></div><div id="gamesGrid" class="games-grid"></div></section>
</main></div>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>

  window.burst=(x,y)=>{for(let i=0;i<30;i++){const a=Math.random()*6.28,s=2+Math.random()*5;bs.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:60,h:Math.random()*360})}};
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  (function f(){requestAnimationFrame(f);if(document.hidden)return;if(!(fr++%90))col=getComputedStyle(document.documentElement).getPropertyValue("--pr").trim()||col;
    cx.clearRect(0,0,W_,H_);cx.fillStyle=col;cx.strokeStyle=col;
    ps.forEach((a,i)=>{a.x=(a.x+a.vx+W_)%W_;a.y=(a.y+a.vy+H_)%H_;const X=a.x+px*a.r*18,Y=a.y+py*a.r*18;cx.globalAlpha=.55;cx.beginPath();cx.arc(X,Y,a.r,0,6.28);cx.fill();
      for(let j=i+1;j<ps.length;j++){const b=ps[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;if(d<9000){cx.globalAlpha=.16*(1-d/9000);cx.beginPath();cx.moveTo(X,Y);cx.lineTo(b.x+px*b.r*18,b.y+py*b.r*18);cx.stroke()}}});
    for(let i=bs.length-1;i>=0;i--){const b=bs[i];b.x+=b.vx;b.y+=b.vy;b.vy+=.12;b.l--;if(b.l<=0){bs.splice(i,1);continue}cx.globalAlpha=b.l/60;cx.fillStyle="hsl("+b.h+" 90% 60%)";cx.fillRect(b.x,b.y,6,6)}
  })();
})();

if(matchMedia("(pointer:fine)").matches)addEventListener("pointermove",e=>{const c=$(".card.game");if(!c||$("#p-learn").hidden)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=Math.abs(x)<.9&&Math.abs(y)<.9?"perspective(1100px) rotateY("+x*3+"deg) rotateX("+-y*3+"deg)":""});
let tk=0,lastActive=Date.now();
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>{lastActive=Date.now()},{passive:true}));
setInterval(()=>{if(!document.hidden&&Date.now()-lastActive<90000){const k=dk();st.min[k]=(st.min[k]||0)+.5;if(!(++tk%4))save()}},30000);
fillSelects();theme(st.theme);go("learn");$("#snd").textContent=st.sound?"🔊":"🔇";lang();newRound();mascot("hi");if(!st.lv)startTest();
